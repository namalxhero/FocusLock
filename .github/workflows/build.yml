name: Build FocusLock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/focuslock.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/focuslock.jks" >> "$GITHUB_ENV"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - APK will use a random debug key (updates will NOT install over the old app)"
          fi

      - name: Build APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || { echo "::error::$(grep -E '^e: |What went wrong|Could not|error:|FAILED' -A3 build.log | head -20 | tr '\n' ' ' | cut -c1-1800)"; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk FocusLock.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug
          path: FocusLock.apk

      # The app checks this release for updates. Only published when a stable key was used.
      - name: Publish release (auto-update source)
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" FocusLock.apk \
            --title "FocusLock v${{ github.run_number }}" \
            --notes "Auto-built from commit ${GITHUB_SHA::7}" \
            --latest
