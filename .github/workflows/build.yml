name: Build FocusLock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || { echo "::error::$(grep -E '^e: |What went wrong|Could not|error:|FAILED' -A3 build.log | head -20 | tr '\n' ' ' | cut -c1-1800)"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
